name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pandas-stubs
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast tests with coverage
        run: pytest -m "not slow" --cov --cov-report=term-missing
      - name: Monte Carlo calibration tests
        if: matrix.python-version == '3.12'
        run: pytest -m slow

  minimum-versions:
    name: Tests with the oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "numpy==1.24.4" "scipy==1.10.1" "pandas==2.0.3" \
            "scikit-learn==1.3.2" "statsmodels==0.14.1" "arch==6.2.0" "matplotlib==3.7.5"
      - name: Tests
        run: pytest -m "not slow"

  experiments:
    name: Experiment scripts (quick runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[experiments]"
      - name: Tables in docs/results.md match experiments/results
        run: python experiments/tables.py --check
      - name: Quick runs
        run: |
          python experiments/equity_rules.py --quick
          python experiments/fx_rules.py --quick
          python experiments/calibration.py --quick
          python experiments/cv_leakage.py --quick
