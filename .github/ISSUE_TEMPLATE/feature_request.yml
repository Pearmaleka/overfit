name: Feature request
description: Propose a new test, estimator or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question can you not answer with the library today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The method or change you have in mind, and the paper it comes from if any.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How to validate it
      description: A worked example, reference implementation or simulation that a test could check against.
