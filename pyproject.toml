[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "overfit"
version = "0.1.0"
description = "Is your backtest skill or luck? Deflated Sharpe ratio, PBO, Reality Check, SPA, Romano-Wolf and purged cross-validation in one small library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Le Nam Khanh" }]
keywords = [
  "backtesting",
  "sharpe ratio",
  "multiple testing",
  "data snooping",
  "quantitative finance",
  "cross-validation",
  "bootstrap",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.3", "matplotlib>=3.7", "arch>=6.2"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
  "ruff>=0.6",
  "mypy>=1.10",
  "statsmodels>=0.14",
  "arch>=6.2",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.scripts]
overfit = "overfit.cli:main"

[project.urls]
Repository = "https://github.com/Pearmaleka/clone"

[tool.hatch.build.targets.wheel]
packages = ["src/overfit"]

[tool.hatch.build.targets.sdist]
include = ["src/overfit", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: Monte Carlo checks that take more than a few seconds"]

[tool.coverage.run]
source = ["overfit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
